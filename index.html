<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>GD Pocket</title>
<meta name="theme-color" content="#282a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
  :root { --bg:#1e1f29; --bar:#282a36; --txt:#f8f8f2; --acc:#478cbf; --mut:#44475a; --ok:#50fa7b; --warn:#ffb86c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:6px; padding:8px; background:var(--bar); align-items:center; }
  header input[type=text] { flex:1; min-width:0; background:var(--mut); color:var(--txt); border:0; border-radius:6px; padding:8px; font-size:15px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:8px 10px; font-size:15px; }
  button.ghost { background:var(--mut); }
  button:disabled { opacity:.5; }
  #editor { flex:1; min-height:0; }
  .CodeMirror { height:100%; font-size:15px; font-family:"JetBrains Mono", ui-monospace, monospace; }
  .CodeMirror-hints { font-size:15px; z-index:50; }
  #keys { display:flex; gap:4px; overflow-x:auto; padding:6px; background:var(--bar); }
  #keys button { background:var(--mut); min-width:42px; font-family:monospace; padding:8px; }
  #status { font-size:12px; opacity:.8; padding:0 8px 6px; background:var(--bar); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status.dirty::before { content:"● "; color:var(--warn); }

  /* Panneau GitHub */
  #panel { position:fixed; inset:0; background:var(--bg); z-index:100; display:none; flex-direction:column; }
  #panel.open { display:flex; }
  #panel .top { display:flex; gap:6px; padding:8px; background:var(--bar); align-items:center; }
  #panel .top h2 { flex:1; margin:0; font-size:17px; }
  .tabs { display:flex; background:var(--bar); }
  .tabs button { flex:1; border-radius:0; background:transparent; border-bottom:2px solid transparent; }
  .tabs button.on { border-bottom-color:var(--acc); }
  .pane { flex:1; overflow:auto; padding:10px; display:none; }
  .pane.on { display:block; }
  label { display:block; font-size:13px; opacity:.8; margin:12px 0 4px; }
  .pane input[type=text], .pane input[type=password], .pane input[type=search] {
    width:100%; background:var(--mut); color:var(--txt); border:0; border-radius:6px; padding:10px; font-size:15px; }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .hint { font-size:13px; opacity:.75; line-height:1.4; }
  #list { list-style:none; margin:10px 0 0; padding:0; }
  #list li { padding:12px 8px; border-bottom:1px solid var(--mut); font-family:ui-monospace, monospace; font-size:14px; word-break:break-all; }
  #list li .dir { opacity:.55; }
  #list li.current { color:var(--ok); }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
  .pane h3 { font-size:15px; margin:22px 0 4px; padding-top:14px; border-top:1px solid var(--mut); }
  .pane select { width:100%; background:var(--mut); color:var(--txt); border:0; border-radius:6px; padding:10px; font-size:15px; }

  /* ---------- Thème « Godot » : couleurs par défaut de l'éditeur de script Godot 4 ---------- */
  .cm-s-godot.CodeMirror { background:#1d2229; color:#cdcfd2; }
  .cm-s-godot .CodeMirror-gutters { background:#1d2229; border-right:0; }
  .cm-s-godot .CodeMirror-linenumber { color:rgba(205,207,210,.5); }
  .cm-s-godot .CodeMirror-cursor { border-left:2px solid #e0e0e0; }
  .cm-s-godot .CodeMirror-activeline-background { background:rgba(255,255,255,.07); }
  .cm-s-godot div.CodeMirror-selected, .cm-s-godot .CodeMirror-line::selection,
  .cm-s-godot .CodeMirror-line > span::selection, .cm-s-godot .CodeMirror-line > span > span::selection { background:rgba(112,186,250,.4); }
  .cm-s-godot .CodeMirror-matchingbracket { color:#cdcfd2 !important; background:rgba(255,255,255,.15); text-decoration:none; }
  .cm-s-godot .cm-gd-kw      { color:#ff7085; }  /* var, func, extends, true, self… */
  .cm-s-godot .cm-gd-flow    { color:#ff8ccc; }  /* if, for, return… */
  .cm-s-godot .cm-gd-base    { color:#42ffc2; }  /* int, float, Vector3… */
  .cm-s-godot .cm-gd-engine  { color:#8fffdb; }  /* Node3D, Input… */
  .cm-s-godot .cm-gd-user    { color:#c7ffed; }  /* tes classes (class_name) */
  .cm-s-godot .cm-gd-comment { color:rgba(205,207,210,.5); }
  .cm-s-godot .cm-gd-doc     { color:rgba(153,179,204,.8); }
  .cm-s-godot .cm-gd-string  { color:#ffeda1; }
  .cm-s-godot .cm-gd-sname   { color:#ffc2a6; }  /* &"nom" */
  .cm-s-godot .cm-gd-npath   { color:#b8c47d; }  /* ^"chemin" */
  .cm-s-godot .cm-gd-noderef { color:#63c259; }  /* $Noeud, %Unique */
  .cm-s-godot .cm-gd-num     { color:#a1ffe0; }
  .cm-s-godot .cm-gd-sym     { color:#abc9ff; }
  .cm-s-godot .cm-gd-fcall   { color:#57b3ff; }  /* appel de fonction */
  .cm-s-godot .cm-gd-gfunc   { color:#a3a3f5; }  /* print, str, lerp… */
  .cm-s-godot .cm-gd-fdef    { color:#66e6ff; }  /* nom après func */
  .cm-s-godot .cm-gd-member  { color:#bce0ff; }  /* .position, .velocity… */
  .cm-s-godot .cm-gd-annot   { color:#ffb373; }  /* @export, @onready… */

  /* Thème « Dracula » (ancien) avec les mêmes catégories */
  .cm-s-dracula .cm-gd-kw, .cm-s-dracula .cm-gd-flow { color:#ff79c6; }
  .cm-s-dracula .cm-gd-base, .cm-s-dracula .cm-gd-engine, .cm-s-dracula .cm-gd-user { color:#8be9fd; font-style:italic; }
  .cm-s-dracula .cm-gd-comment, .cm-s-dracula .cm-gd-doc { color:#6272a4; }
  .cm-s-dracula .cm-gd-string, .cm-s-dracula .cm-gd-sname, .cm-s-dracula .cm-gd-npath { color:#f1fa8c; }
  .cm-s-dracula .cm-gd-noderef { color:#ffb86c; }
  .cm-s-dracula .cm-gd-num { color:#bd93f9; }
  .cm-s-dracula .cm-gd-sym { color:#ff79c6; }
  .cm-s-dracula .cm-gd-fcall, .cm-s-dracula .cm-gd-gfunc, .cm-s-dracula .cm-gd-fdef { color:#50fa7b; }
  .cm-s-dracula .cm-gd-member { color:#f8f8f2; }
  .cm-s-dracula .cm-gd-annot { color:#ffb86c; }
</style>
</head>
<body>
<header>
  <button id="btnFiles" class="ghost" aria-label="Fichiers GitHub">📁</button>
  <input id="name" type="text" value="script.gd" aria-label="Nom du fichier">
  <button id="save">Enregistrer</button>
</header>
<div id="editor"></div>
<div id="keys"></div>
<div id="status">Prêt</div>

<!-- Panneau : fichiers et réglages -->
<div id="panel">
  <div class="top">
    <h2>GD Pocket</h2>
    <button id="closePanel" class="ghost">Fermer</button>
  </div>
  <div class="tabs">
    <button data-tab="files" class="on">Fichiers</button>
    <button data-tab="settings">Réglages</button>
  </div>

  <div class="pane on" id="pane-files">
    <div class="row" style="margin-top:0">
      <button id="refresh">↻ Actualiser</button>
      <button id="openLocal" class="ghost">Ouvrir un fichier du téléphone</button>
      <button id="download" class="ghost">Télécharger le fichier actuel</button>
    </div>
    <input id="filter" type="search" placeholder="Filtrer (ex. voiture)" style="margin-top:10px">
    <label class="check"><input id="allText" type="checkbox"> Afficher aussi .tscn, .tres, .cfg, .json, .md…</label>
    <ul id="list"></ul>
    <p class="hint" id="filesHint">Renseigne d'abord l'onglet Réglages.</p>
  </div>

  <div class="pane" id="pane-settings">
    <label for="ghOwner">Propriétaire du dépôt</label>
    <input id="ghOwner" type="text" autocomplete="off" autocapitalize="off" placeholder="LutiinBlack">
    <label for="ghRepo">Nom du dépôt</label>
    <input id="ghRepo" type="text" autocomplete="off" autocapitalize="off" placeholder="Micro-Racer-Mobile-">
    <label for="ghBranch">Branche (vide = branche principale)</label>
    <input id="ghBranch" type="text" autocomplete="off" autocapitalize="off" placeholder="main">
    <label for="ghToken">Jeton GitHub (fine-grained)</label>
    <input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="row">
      <button id="saveSettings">Enregistrer et tester</button>
      <button id="forget" class="ghost">Effacer le jeton</button>
    </div>
    <p class="hint">Le jeton reste uniquement dans cette appli, sur ce téléphone, et n'est envoyé qu'à api.github.com.</p>

    <h3>Affichage</h3>
    <label for="prefTheme">Couleurs du code</label>
    <select id="prefTheme">
      <option value="godot">Godot (comme l'éditeur de script)</option>
      <option value="dracula">Dracula</option>
    </select>
    <label class="check"><input id="prefWrap" type="checkbox"> Retour à la ligne automatique des lignes longues</label>
  </div>
  <input id="file" type="file" accept=".gd,.gdshader,.txt,text/plain" hidden>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script>
// ---------- Petits utilitaires de stockage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("gdpocket_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gdpocket_" + k, JSON.stringify(v)); } catch (e) {} },
  del(k)    { try { localStorage.removeItem("gdpocket_" + k); } catch (e) {} }
};
const $ = id => document.getElementById(id);

// ---------- Vocabulaire GDScript (Godot 4) ----------
const KEYWORDS = ["if","elif","else","for","while","match","when","break","continue","pass","return",
  "class","class_name","extends","is","in","as","not","and","or","func","static","const","enum",
  "var","signal","await","breakpoint","preload","load","super","assert","yield"];
const ANNOTATIONS = ["@export","@export_range","@export_enum","@export_file","@export_dir",
  "@export_multiline","@export_color_no_alpha","@export_flags","@export_group","@export_subgroup",
  "@export_category","@export_node_path","@onready","@tool","@icon","@static_unload","@warning_ignore","@rpc"];
const TYPES = ["void","bool","int","float","String","StringName","NodePath","Vector2","Vector2i",
  "Vector3","Vector3i","Vector4","Color","Rect2","Transform2D","Transform3D","Basis","Quaternion",
  "AABB","Plane","Array","Dictionary","PackedScene","Callable","Signal","Object","Node","Node2D",
  "Node3D","Control","Resource","CharacterBody2D","CharacterBody3D","RigidBody2D","RigidBody3D",
  "VehicleBody3D","VehicleWheel3D","Area2D","Area3D","Camera2D","Camera3D","Sprite2D","Sprite3D",
  "MeshInstance3D","AnimationPlayer","Timer","Label","Button","Input","InputEvent","Engine","OS",
  "Time","Tween","RayCast3D","CollisionShape3D","PathFollow3D","AudioStreamPlayer"];
const BUILTINS = ["_ready","_process","_physics_process","_input","_unhandled_input","_init",
  "_enter_tree","_exit_tree","print","printerr","push_error","push_warning","str","int","float",
  "abs","clamp","clampf","lerp","lerpf","move_toward","min","max","sign","sqrt","pow","randf",
  "randi","randf_range","randi_range","deg_to_rad","rad_to_deg","is_instance_valid","get_node",
  "get_tree","queue_free","add_child","instantiate","move_and_slide","emit","connect",
  "is_action_pressed","is_action_just_pressed","get_axis","get_vector","delta","velocity","position",
  "rotation","global_position","self","true","false","null","PI","TAU","INF","NAN"];

// ---------- Coloration syntaxique (mêmes catégories que l'éditeur Godot) ----------
const words = list => new RegExp("(?:" + list.join("|") + ")\\b");
const FLOW = ["if","elif","else","for","while","match","when","break","continue","pass","return"];
const KW = ["var","const","func","static","class","class_name","extends","signal","enum","await",
  "is","in","as","not","and","or","super","self","true","false","null","void","breakpoint",
  "preload","load","assert","yield","PI","TAU","INF","NAN"];
const BASE = ["bool","int","float","String","StringName","NodePath","Vector2i","Vector2","Vector3i",
  "Vector3","Vector4i","Vector4","Color","Rect2i","Rect2","Transform2D","Transform3D","Basis",
  "Quaternion","AABB","Plane","Projection","Array","Dictionary","Callable","Signal","RID","Object",
  "PackedByteArray","PackedInt32Array","PackedInt64Array","PackedFloat32Array","PackedFloat64Array",
  "PackedStringArray","PackedVector2Array","PackedVector3Array","PackedColorArray","Variant"];
const ENGINE = ["Node","Node2D","Node3D","Control","Resource","PackedScene","CharacterBody2D",
  "CharacterBody3D","RigidBody2D","RigidBody3D","StaticBody3D","StaticBody2D","VehicleBody3D",
  "VehicleWheel3D","Area2D","Area3D","Camera2D","Camera3D","Sprite2D","Sprite3D","MeshInstance3D",
  "AnimationPlayer","AnimatedSprite2D","Timer","Label","Button","TextureRect","CanvasLayer",
  "Input","InputEvent","InputEventKey","InputEventScreenTouch","InputEventScreenDrag","Engine","OS",
  "Time","Tween","RayCast3D","RayCast2D","CollisionShape3D","CollisionShape2D","Path3D",
  "PathFollow3D","AudioStreamPlayer","AudioStreamPlayer3D","GPUParticles3D","CPUParticles3D",
  "DirectionalLight3D","OmniLight3D","WorldEnvironment","Environment","StandardMaterial3D",
  "BoxMesh","SphereMesh","CylinderMesh","BoxShape3D","SphereShape3D","Curve3D","FastNoiseLite",
  "ResourceLoader","SceneTree","Viewport","Window","DisplayServer","ProjectSettings","FileAccess",
  "DirAccess","JSON","RandomNumberGenerator","PhysicsDirectSpaceState3D","PhysicsRayQueryParameters3D"];
const GFUNC = ["print","prints","printt","print_rich","printerr","push_error","push_warning","str",
  "abs","absf","absi","clamp","clampf","clampi","lerp","lerpf","lerp_angle","inverse_lerp","remap",
  "move_toward","min","max","minf","maxf","mini","maxi","sign","signf","sqrt","pow","exp","log",
  "sin","cos","tan","atan2","floor","ceil","round","snapped","wrapf","wrapi","fmod","randf","randi",
  "randf_range","randi_range","randomize","deg_to_rad","rad_to_deg","is_instance_valid","is_zero_approx",
  "is_equal_approx","smoothstep","range","len","typeof","type_string","instance_from_id","str_to_var",
  "var_to_str","weakref","hash","char","ord","get_stack","print_stack","is_nan","is_inf"];
const MEMBERS = ["position","rotation","rotation_degrees","scale","transform","global_position",
  "global_rotation","global_rotation_degrees","global_transform","basis","velocity","linear_velocity",
  "angular_velocity","visible","modulate","name","owner","text","size","engine_force","brake",
  "steering","up_direction","floor_max_angle","process_mode","current","fov","quaternion"];

CodeMirror.defineSimpleMode("gdscript", {
  start: [
    {regex: /##.*/, token: "gd-doc"},
    {regex: /#.*/, token: "gd-comment"},
    {regex: /&"(?:[^\\"]|\\.)*?(?:"|$)/, token: "gd-sname"},
    {regex: /\^"(?:[^\\"]|\\.)*?(?:"|$)/, token: "gd-npath"},
    {regex: /"""/, token: "gd-string", next: "tstring"},
    {regex: /"(?:[^\\"]|\\.)*?(?:"|$)/, token: "gd-string"},
    {regex: /'(?:[^\\']|\\.)*?(?:'|$)/, token: "gd-string"},
    {regex: /@[A-Za-z_]\w*/, token: "gd-annot"},
    {regex: /\$(?:"[^"]*"|[\w\/]+)|%[A-Za-z_]\w*/, token: "gd-noderef"},
    {regex: /0x[0-9a-fA-F_]+|0b[01_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:e[+-]?\d+)?/, token: "gd-num"},
    {regex: /(func)(\s+)([A-Za-z_]\w*)/, token: ["gd-kw", null, "gd-fdef"]},
    {regex: /(\.)([A-Za-z_]\w*)(?=\s*\()/, token: ["gd-sym", "gd-fcall"]},
    {regex: /(\.)([A-Za-z_]\w*)/, token: ["gd-sym", "gd-member"]},
    {regex: words(FLOW), token: "gd-flow"},
    {regex: words(KW), token: "gd-kw"},
    {regex: words(BASE), token: "gd-base"},
    {regex: new RegExp("(?:" + GFUNC.join("|") + ")(?=\\s*\\()"), token: "gd-gfunc"},
    {regex: words(ENGINE), token: "gd-engine"},
    {regex: /[A-Za-z_]\w*(?=\s*\()/, token: "gd-fcall"},
    {regex: words(MEMBERS), token: "gd-member"},         // propriétés héritées (position, velocity…)
    {regex: /[A-Z][A-Z0-9_]*\b/, token: null},          // CONSTANTES : couleur du texte
    {regex: /[A-Z]\w*/, token: "gd-user"},               // tes classes (class_name)
    {regex: /[A-Za-z_]\w*/, token: null},                // variables : couleur du texte
    {regex: /[-+*\/%=<>!&|^~.,:;()\[\]{}]/, token: "gd-sym"}
  ],
  tstring: [
    {regex: /.*?"""/, token: "gd-string", next: "start"},
    {regex: /.*/, token: "gd-string"}
  ],
  meta: {lineComment: "#"}
});

// ---------- Autocomplétion ----------
const BASE_WORDS = [...new Set([...KEYWORDS, ...ANNOTATIONS, ...TYPES, ...BUILTINS])];
function gdHint(cm) {
  const cur = cm.getCursor(), line = cm.getLine(cur.line);
  let start = cur.ch;
  while (start > 0 && /[\w@]/.test(line.charAt(start - 1))) start--;
  const word = line.slice(start, cur.ch);
  if (!word) return null;
  const docWords = cm.getValue().match(/@?[A-Za-z_]\w{2,}/g) || [];
  const all = [...new Set([...BASE_WORDS, ...docWords])];
  const low = word.toLowerCase();
  const list = all.filter(w => w !== word && w.toLowerCase().startsWith(low))
                  .sort((a, b) => a.length - b.length).slice(0, 30);
  return list.length ? {list, from: CodeMirror.Pos(cur.line, start), to: cur} : null;
}

// ---------- Éditeur ----------
const SAMPLE = `extends CharacterBody3D

@export var vitesse: float = 10.0

func _physics_process(delta: float) -> void:
\tvar direction := Input.get_axis("gauche", "droite")
\tvelocity.x = direction * vitesse
\tmove_and_slide()
`;
let savedCode = null;
try { savedCode = localStorage.getItem("gdpocket_code"); } catch (e) {}

// Fichier GitHub actuellement ouvert : {path, sha, base} (base = texte tel que sur GitHub)
let ghFile = store.get("ghfile", null);

// Préférences d'affichage : thème et retour à la ligne
const prefs = Object.assign({theme: "godot", wrap: false}, store.get("prefs", {}));
document.body.style.background = prefs.theme === "godot" ? "#1d2229" : "";

const cm = CodeMirror($("editor"), {
  value: savedCode || SAMPLE,
  mode: "gdscript",
  theme: prefs.theme,
  lineWrapping: prefs.wrap,
  styleActiveLine: true,
  lineNumbers: true,
  indentUnit: 4, tabSize: 4, indentWithTabs: true,
  autoCloseBrackets: true, matchBrackets: true,
  inputStyle: "contenteditable",
  extraKeys: {
    "Enter": c => {
      const p = c.getCursor(), before = c.getLine(p.line).slice(0, p.ch);
      let ind = before.match(/^\s*/)[0];
      if (/:\s*(#.*)?$/.test(before)) ind += "\t";
      c.replaceSelection("\n" + ind);
    },
    "Ctrl-Space": c => c.showHint({hint: gdHint, completeSingle: false}),
    "Ctrl-S": () => save()
  }
});
cm.on("inputRead", (c, ch) => {
  if (/[\w@]/.test(ch.text.join(""))) c.showHint({hint: gdHint, completeSingle: false});
});
let timer;
cm.on("change", () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    try { localStorage.setItem("gdpocket_code", cm.getValue()); } catch (e) {}
    store.set("name", nameInput.value);
    refreshStatus();
  }, 600);
});

// ---------- Barre de touches ----------
const KEYS = ["⇥", ":", "(", ")", "_", "\"", "$", "@", "=", ".", "[", "]", "{", "}", "->", "#"];
KEYS.forEach(k => {
  const b = document.createElement("button");
  b.textContent = k;
  b.addEventListener("mousedown", e => e.preventDefault());
  b.addEventListener("click", () => { cm.replaceSelection(k === "⇥" ? "\t" : k); cm.focus(); });
  $("keys").appendChild(b);
});

// ---------- Barre d'état ----------
const nameInput = $("name");
nameInput.value = store.get("name", "script.gd");
function isDirty() { return ghFile && cm.getValue() !== ghFile.base; }
function refreshStatus(msg) {
  const s = $("status");
  s.classList.toggle("dirty", !!isDirty());
  if (msg) { s.textContent = msg; return; }
  if (ghFile) s.textContent = (isDirty() ? "Modifié — " : "À jour — ") + "GitHub : " + ghFile.path;
  else s.textContent = "Fichier local (sauvegarde auto dans l'appli)";
  $("save").textContent = ghFile ? "Envoyer" : "Enregistrer";
}

// ---------- GitHub : API ----------
function cfg() { return store.get("gh", {}); }
function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
async function gh(path, opts = {}) {
  const c = cfg();
  if (!c.token) throw new Error("Aucun jeton : va dans Réglages.");
  const r = await fetch("https://api.github.com" + path, {
    ...opts,
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + c.token,
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.body ? {"Content-Type": "application/json"} : {})
    }
  });
  if (!r.ok) {
    let msg = r.status + "";
    try { msg += " : " + (await r.json()).message; } catch (e) {}
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r.json();
}
function b64ToText(b) {
  const bin = atob(b.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}
function textToB64(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function friendly(e) {
  if (e.status === 401) return "Jeton refusé (expiré ou mal copié).";
  if (e.status === 403) return "Accès refusé : vérifie les permissions du jeton (Contents : Read and write).";
  if (e.status === 404) return "Introuvable : vérifie le propriétaire, le dépôt et la branche, et que le jeton y a accès.";
  if (!navigator.onLine) return "Pas de connexion Internet.";
  return e.message;
}

// ---------- GitHub : liste des fichiers ----------
let tree = [];
const GD_RE = /\.(gd|gdshader)$/i;
const TEXT_RE = /\.(gd|gdshader|tscn|tres|cfg|godot|json|md|txt|csv|import)$/i;
async function loadTree() {
  const c = cfg();
  if (!c.token || !c.owner || !c.repo) { $("filesHint").textContent = "Renseigne d'abord l'onglet Réglages."; return; }
  $("filesHint").textContent = "Chargement…";
  try {
    const t = await gh(`/repos/${c.owner}/${c.repo}/git/trees/${encodeURIComponent(c.branch)}?recursive=1`);
    tree = t.tree.filter(x => x.type === "blob").map(x => x.path).sort();
    store.set("tree", tree);
    renderList();
    $("filesHint").textContent = t.truncated ? "Dépôt très gros : liste incomplète." : "";
  } catch (e) {
    $("filesHint").textContent = "Erreur : " + friendly(e);
  }
}
function renderList() {
  const q = $("filter").value.trim().toLowerCase();
  const re = $("allText").checked ? TEXT_RE : GD_RE;
  const items = tree.filter(p => re.test(p) && p.toLowerCase().includes(q));
  const ul = $("list"); ul.innerHTML = "";
  items.forEach(p => {
    const li = document.createElement("li");
    const i = p.lastIndexOf("/");
    li.innerHTML = `<span class="dir"></span><span></span>`;
    li.children[0].textContent = i >= 0 ? p.slice(0, i + 1) : "";
    li.children[1].textContent = p.slice(i + 1);
    if (ghFile && ghFile.path === p) li.classList.add("current");
    li.onclick = () => openGh(p);
    ul.appendChild(li);
  });
  if (!items.length && tree.length) $("filesHint").textContent = "Aucun fichier ne correspond.";
}

// ---------- GitHub : ouvrir ----------
async function openGh(path) {
  if (isDirty() && !confirm("Le fichier actuel a des modifications non envoyées. Les abandonner ?")) return;
  const c = cfg();
  $("filesHint").textContent = "Ouverture de " + path + "…";
  try {
    const f = await gh(`/repos/${c.owner}/${c.repo}/contents/${encPath(path)}?ref=${encodeURIComponent(c.branch)}`);
    const text = b64ToText(f.content);
    ghFile = {path, sha: f.sha, base: text};
    store.set("ghfile", ghFile);
    cm.setValue(text);
    cm.clearHistory();
    nameInput.value = path.split("/").pop();
    store.set("name", nameInput.value);
    closePanel();
    refreshStatus();
  } catch (e) {
    $("filesHint").textContent = "Erreur : " + friendly(e);
  }
}

// ---------- GitHub : envoyer ----------
async function pushGh(force = false, presetMsg = null) {
  const c = cfg();
  const text = cm.getValue();
  if (!isDirty() && !force) { refreshStatus("Rien à envoyer, déjà à jour ✔"); return; }
  const file = ghFile.path.split("/").pop();
  const message = presetMsg !== null ? presetMsg : prompt("Message du commit :", "GD Pocket : modifie " + file);
  if (message === null) return;
  $("save").disabled = true;
  refreshStatus("Envoi vers GitHub…");
  try {
    const r = await gh(`/repos/${c.owner}/${c.repo}/contents/${encPath(ghFile.path)}`, {
      method: "PUT",
      body: JSON.stringify({message: message || ("GD Pocket : modifie " + file),
                            content: textToB64(text), sha: ghFile.sha, branch: c.branch})
    });
    ghFile = {path: ghFile.path, sha: r.content.sha, base: text};
    store.set("ghfile", ghFile);
    refreshStatus();
    refreshStatus("Envoyé sur GitHub ✔ (pense à faire un pull sur le PC)");
  } catch (e) {
    if (e.status === 409 || e.status === 422) {
      // Le fichier a changé sur GitHub depuis l'ouverture (PC ou autre appli)
      if (confirm("Ce fichier a été modifié sur GitHub depuis que tu l'as ouvert.\n\nOK = écraser avec ta version\nAnnuler = ne rien envoyer")) {
        try {
          const f = await gh(`/repos/${c.owner}/${c.repo}/contents/${encPath(ghFile.path)}?ref=${encodeURIComponent(c.branch)}`);
          ghFile.sha = f.sha;  // on repart de la version actuelle de GitHub
          $("save").disabled = false;
          return pushGh(true, message);
        } catch (e2) { refreshStatus("Erreur : " + friendly(e2)); }
      } else refreshStatus("Envoi annulé. Ta version reste dans l'appli.");
    } else refreshStatus("Erreur : " + friendly(e));
  } finally { $("save").disabled = false; }
}

// ---------- Local : ouvrir / télécharger ----------
$("openLocal").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0];
  if (!f) return;
  if (isDirty() && !confirm("Le fichier GitHub ouvert a des modifications non envoyées. Les abandonner ?")) return;
  cm.setValue(await f.text());
  ghFile = null; store.del("ghfile");
  nameInput.value = f.name; store.set("name", f.name);
  $("file").value = "";
  closePanel(); refreshStatus("Ouvert depuis le téléphone : " + f.name);
};
function download() {
  const blob = new Blob([cm.getValue()], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nameInput.value || "script.gd";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  refreshStatus("Téléchargé : " + a.download);
}
$("download").onclick = download;
function save() { ghFile ? pushGh() : download(); }
$("save").onclick = save;

// ---------- Panneau ----------
function openPanel() {
  $("panel").classList.add("open");
  const c = cfg();
  tree = store.get("tree", []);
  renderList();
  if (!c.token) showTab("settings"); else if (!tree.length) loadTree();
}
function closePanel() { $("panel").classList.remove("open"); }
function showTab(t) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t));
}
$("btnFiles").onclick = openPanel;
$("closePanel").onclick = closePanel;
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("refresh").onclick = loadTree;
$("filter").oninput = renderList;
$("allText").onchange = renderList;

// ---------- Réglages ----------
(function fillSettings() {
  const c = cfg();
  $("ghOwner").value = c.owner || "LutiinBlack";
  $("ghRepo").value = c.repo || "Micro-Racer-Mobile-";
  $("ghBranch").value = c.branch || "";
  $("ghToken").value = c.token || "";
})();
$("saveSettings").onclick = async () => {
  const c = {owner: $("ghOwner").value.trim(), repo: $("ghRepo").value.trim(),
             branch: $("ghBranch").value.trim(), token: $("ghToken").value.trim()};
  store.set("gh", c);
  $("saveSettings").disabled = true;
  try {
    const info = await gh(`/repos/${c.owner}/${c.repo}`);
    if (!c.branch) { c.branch = info.default_branch; $("ghBranch").value = c.branch; store.set("gh", c); }
    store.del("tree");
    alert("Connexion réussie ✔\nDépôt : " + info.full_name + "\nBranche : " + c.branch);
    showTab("files"); loadTree();
  } catch (e) {
    alert("Échec : " + friendly(e));
  } finally { $("saveSettings").disabled = false; }
};
$("prefTheme").value = prefs.theme;
$("prefWrap").checked = prefs.wrap;
$("prefTheme").onchange = () => {
  prefs.theme = $("prefTheme").value; store.set("prefs", prefs);
  cm.setOption("theme", prefs.theme);
  document.body.style.background = prefs.theme === "godot" ? "#1d2229" : "";
};
$("prefWrap").onchange = () => {
  prefs.wrap = $("prefWrap").checked; store.set("prefs", prefs);
  cm.setOption("lineWrapping", prefs.wrap);
};

$("forget").onclick = () => {
  const c = cfg(); delete c.token; store.set("gh", c);
  $("ghToken").value = ""; store.del("tree");
  alert("Jeton effacé de l'appli.");
};

refreshStatus();

// ---------- Mode appli (PWA) ----------
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
